name: deploy-space

permissions:
  contents: read

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "Dockerfile"
      - "pyproject.toml"
      - ".github/workflows/deploy-space.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync
      - name: Deploy EuroStream to Hugging Face Space
        run: |
          uv run python -c "
          import os, tempfile
          from pathlib import Path
          from huggingface_hub import HfApi
          from huggingface_hub.errors import HfHubHTTPError

          token = os.environ.get('HF_TOKEN')
          if not token:
              print('::error::HF_TOKEN not configured in GitHub repository secrets')
              exit(1)

          api = HfApi(token=token)
          space_id = 'swadhinbiswas/eurostream'

          # 1. Try Docker space (works if PRO or space already exists)
          try:
              api.create_repo(repo_id=space_id, repo_type='space', space_sdk='docker', exist_ok=True)
              api.upload_folder(
                  folder_path='.',
                  repo_id=space_id,
                  repo_type='space',
                  ignore_patterns=['.git/**', '.venv/**', 'site/**', 'notes/**', 'assets/**', 'data/**', '**/__pycache__/**', '*.pyc']
              )
              print(f'Successfully deployed Docker backend to https://huggingface.co/spaces/{space_id}')
              exit(0)
          except HfHubHTTPError as e:
              if '402' in str(e) or 'Payment Required' in str(e):
                  print('::notice::Hugging Face Docker Spaces require a PRO plan. Deploying 100% free Static Space portal instead.')
              else:
                  print(f'::warning::Docker Space creation note: {e}. Falling back to Static Space.')

          # 2. Free Static Space fallback (guaranteed 100% free for everyone)
          from eurostream.portal import build_portal_html
          with tempfile.TemporaryDirectory() as tmpdir:
              tmp = Path(tmpdir)
              (tmp / 'index.html').write_text(build_portal_html())
              (tmp / 'README.md').write_text(
                  '---\ntitle: EuroStream\nemoji: ⚡\ncolorFrom: blue\ncolorTo: indigo\nsdk: static\npinned: false\n---\n\n# EuroStream Documentation Portal\n\nLive at https://huggingface.co/spaces/' + space_id
              )
              api.create_repo(repo_id=space_id, repo_type='space', space_sdk='static', exist_ok=True)
              api.upload_folder(
                  folder_path=str(tmp),
                  repo_id=space_id,
                  repo_type='space'
              )
              print(f'Successfully deployed free Static Portal to https://huggingface.co/spaces/{space_id}')
          "
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

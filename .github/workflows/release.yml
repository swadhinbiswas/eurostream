name: release

# Publishes to PyPI with trusted publishing: OIDC, no long-lived token in
# repository secrets (the PyPI side needs a trusted publisher configured for
# this repo and environment — until then the publish job fails there, which
# is the safe direction to fail in).
#
# Three gates stand between a tag and something someone can pip install:
#
#   1. the same quality gate CI runs on every push — lint, format, strict
#      types, tests with the coverage floor, event-contract baseline;
#   2. a build twine can actually read (a pretty wheel with broken metadata
#      is still broken);
#   3. version agreement between the release tag, the wheel's own metadata
#      and eurostream.__version__.
#
# (3) is the one that catches a tag pushed at the wrong commit: `v0.3.0`
# built from a tree that still says 0.2.0 would otherwise ship silently and
# install itself over the real 0.3.0 later.

permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run pytest -q --cov=eurostream --cov-report=term
      - run: uv run eurostream contracts --baseline governance/contracts.json

  build:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv build
      - name: The artifacts must be readable and well-formed
        run: uvx twine check --strict dist/*
      - name: The tag, the wheel and the module must agree on the version
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          wheel="$(basename "$(ls dist/*.whl)" | cut -d- -f2)"
          runtime="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/eurostream/__init__.py)"
          printf 'tag=%s wheel=%s runtime=%s\n' "$tag" "$wheel" "$runtime"
          test "$tag" = "$wheel"
          test "$tag" = "$runtime"
      - name: The changelog must have a dated entry for this version
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          heading="## [${tag}] - "
          if ! grep -qF "$heading" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${tag} — a version with no note is the one people upgrade past"
            exit 1
          fi
          if ! grep -F "$heading" CHANGELOG.md | head -1 | grep -qE "^## \[[^]]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$"; then
            echo "::error::the ${tag} heading must carry an ISO date: ## [${tag}] - YYYY-MM-DD"
            exit 1
          fi
          echo "CHANGELOG.md has a dated section for ${tag}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    # workflow_dispatch exists to exercise the build and gate without
    # publishing; only a published GitHub Release is allowed to upload.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/eurostream
    permissions:
      id-token: write # OIDC for trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

name: orchestrate

on:
  schedule:
    - cron: "0 */4 * * *"  # every 4 hours -> fresh batch into lake
  push:
    branches: [master]  # also on every push to swadhinbiswas/eustream lake
  workflow_dispatch: {}

jobs:
  medallion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      
      - name: Probe Event Bus Backend (Kafka or SQLite fallback)
        id: probe
        run: |
          uv run python -c "
          import os
          from confluent_kafka.admin import AdminClient, NewTopic
          
          raw = os.environ.get('KAFKA_BOOTSTRAP', '').strip().strip('\"\'')
          user = os.environ.get('KAFKA_USER', '').strip().strip('\"\'')
          pwd = os.environ.get('KAFKA_PASS', '').strip().strip('\"\'')
          
          if not raw or raw == '***' or not user or not pwd:
              print('::notice::Kafka secrets not fully set — using local SQLite WAL event bus')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f: f.write('backend=sqlite\n')
              exit(0)
          
          # Clean any schema, auth prefix, or trailing paths
          if '://' in raw: raw = raw.split('://', 1)[1]
          if '@' in raw: raw = raw.split('@', 1)[1]
          raw = raw.split('/', 1)[0].split('?', 1)[0].strip().strip('\"\'')
          
          conf = {
              'bootstrap.servers': raw,
              'security.protocol': 'SASL_SSL',
              'sasl.mechanism': 'SCRAM-SHA-256',
              'sasl.username': user,
              'sasl.password': pwd,
              'broker.address.family': 'v4',
              'socket.timeout.ms': 8000,
              'request.timeout.ms': 8000,
          }
          try:
              admin = AdminClient(conf)
              md = admin.list_topics(timeout=8)
              print(f'Connected to Kafka cluster: {len(md.topics)} topics present')
              topics = [NewTopic(t, 1, 1) for t in ['orders', 'clicks', 'payments', 'erasure_requests']]
              fs = admin.create_topics(topics, request_timeout=10)
              for t, f in fs.items():
                  try:
                      f.result()
                      print(f'created {t}')
                  except Exception as e:
                      if 'already exists' in str(e).lower() or 'TopicAlreadyExists' in str(e):
                          print(f'{t}: already exists')
                      else:
                          print(f'{t}: {e}')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f: f.write('backend=kafka\n')
          except Exception as e:
              print(f'::warning::Kafka cluster probe failed ({e}) — falling back to local SQLite event bus')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f: f.write('backend=sqlite\n')
          "
        env:
          KAFKA_BOOTSTRAP: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_USER: ${{ secrets.KAFKA_USERNAME }}
          KAFKA_PASS: ${{ secrets.KAFKA_PASSWORD }}

      - name: Produce 1k new synthetic events
        timeout-minutes: 3
        run: uv run eurostream produce --events 1000
        env:
          EUROSTREAM_EVENT_BUS_BACKEND: ${{ steps.probe.outputs.backend }}
          EUROSTREAM_KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          EUROSTREAM_KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME }}
          EUROSTREAM_KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD }}
          EUROSTREAM_KAFKA_SECURITY_PROTOCOL: SASL_SSL
          EUROSTREAM_KAFKA_SASL_MECHANISM: SCRAM-SHA-256

      - name: Stream fraud scoring
        run: uv run eurostream stream --max-events 1000
        env:
          EUROSTREAM_EVENT_BUS_BACKEND: ${{ steps.probe.outputs.backend }}
          EUROSTREAM_KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          EUROSTREAM_KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME }}
          EUROSTREAM_KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD }}

      - name: Incremental transform + lake
        run: uv run eurostream transform --incremental
        env:
          EUROSTREAM_EVENT_BUS_BACKEND: ${{ steps.probe.outputs.backend }}
          EUROSTREAM_KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          EUROSTREAM_KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME }}
          EUROSTREAM_KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Push lake to HF swadhinbiswas/eustream
        run: |
          pip install huggingface_hub
          hf upload swadhinbiswas/eustream data/lake --repo-type dataset --token ${{ secrets.HF_TOKEN }}

name: orchestrate
on:
  schedule:
    - cron: "0 */4 * * *"  # 00,04,08,12,16,20 UTC = 06,10,14,18,22,02 Dhaka
  push:
    branches: [master]
  workflow_dispatch: {}
jobs:
  medallion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: orchestrate-medallion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Restore warehouse cache (so lake stays cumulative without Turso)
        uses: actions/cache@v4
        with:
          path: |
            data/eurocart.duckdb
            data/events.db
            governance/pii_manifest.json
          key: eurostream-warehouse-${{ hashFiles('governance/pii_manifest.json') }}
          restore-keys: eurostream-warehouse-
      - run: uv sync
      - name: Probe Kafka or fallback
        id: probe
        run: |
          uv run python -c "
          import os
          from confluent_kafka.admin import AdminClient, NewTopic
          raw=os.environ.get('KAFKA_BOOTSTRAP','').strip()
          if '://' in raw: raw=raw.split('://',1)[1]
          if '@' in raw: raw=raw.split('@',1)[1]
          raw=raw.split('/',1)[0].strip()
          conf={'bootstrap.servers': raw,'security.protocol':'SASL_SSL','sasl.mechanism':'SCRAM-SHA-256','sasl.username':os.environ['KAFKA_USER'],'sasl.password':os.environ['KAFKA_PASS'],'socket.timeout.ms':8000}
          try:
            admin=AdminClient(conf); admin.list_topics(timeout=8)
            print('kafka ok'); open(os.environ['GITHUB_OUTPUT'],'a').write('backend=kafka\n')
          except Exception as e:
            print(f'fallback sqlite: {e}'); open(os.environ['GITHUB_OUTPUT'],'a').write('backend=sqlite\n')
          "
        env:
          KAFKA_BOOTSTRAP: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_USER: ${{ secrets.KAFKA_USERNAME }}
          KAFKA_PASS: ${{ secrets.KAFKA_PASSWORD }}
      - name: Produce 1k
        run: uv run eurostream produce --events 1000
        env:
          EUROSTREAM_EVENT_BUS_BACKEND: ${{ steps.probe.outputs.backend }}
          EUROSTREAM_KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          EUROSTREAM_KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME }}
          EUROSTREAM_KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD }}
      - name: Stream fraud scoring (real-time)
        run: uv run eurostream stream --max-events 3000
        env:
          EUROSTREAM_EVENT_BUS_BACKEND: ${{ steps.probe.outputs.backend }}
          EUROSTREAM_KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          EUROSTREAM_KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME }}
          EUROSTREAM_KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD }}
      - name: Transform --incremental
        run: uv run eurostream transform --incremental
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Push to HF swadhinbiswas/eustream
        run: |
          uv run python -c "
          import os; from huggingface_hub import HfApi
          tok=os.environ.get('HF_TOKEN')
          if not tok: print('HF_TOKEN missing'); exit(0)
          api=HfApi(token=tok)
          api.create_repo(repo_id='swadhinbiswas/eustream', repo_type='dataset', exist_ok=True)
          api.upload_folder(folder_path='data/lake', repo_id='swadhinbiswas/eustream', repo_type='dataset')
          print('uploaded to swadhinbiswas/eustream')
          "
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

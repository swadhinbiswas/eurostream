services:
  api:
    build: .
    image: eurostream:latest
    ports:
      - "7860:7860"
    environment:
      EUROSTREAM_DATA_DIR: /app/data
      EUROSTREAM_WAREHOUSE_PATH: /app/data/eurocart.duckdb
      EUROSTREAM_ERASURE_SLA_SECONDS: ${EUROSTREAM_ERASURE_SLA_SECONDS:-60}
    volumes:
      - eurostream-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1g

  # One-shot job: runs the end-to-end demo against the shared data volume.
  # Useful as a smoke test after `docker compose up api -d`.
  demo:
    build: .
    image: eurostream:latest
    profiles: ["tools"]
    environment:
      EUROSTREAM_DATA_DIR: /app/data
      EUROSTREAM_WAREHOUSE_PATH: /app/data/demo.duckdb
    volumes:
      - eurostream-data:/app/data
    command: eurostream demo

  # Observability: `docker compose --profile observe up` brings the whole
  # stack up — api, Prometheus and Grafana. Off by default so a plain
  # `docker compose up` stays a single container.
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["observe"]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["observe"]
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-eurostream}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  eurostream-data:
  prometheus-data:
  grafana-data:

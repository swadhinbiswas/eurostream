[project]
name = "eurostream"
version = "0.2.0"
description = "GDPR-compliant real-time customer & order analytics platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "duckdb>=1.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "faker>=24",
    "typer>=0.12",
    "httpx>=0.27",
    "confluent-kafka>=2.4; python_version < '3.13'",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://eurostream-docs.pages.dev"
Repository = "https://github.com/swadhin/eurostream"
Issues = "https://github.com/swadhin/eurostream/issues"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
eurostream = "eurostream.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eurostream"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "C4"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S608"]
"src/eurostream/producers.py" = ["S311"]
"src/eurostream/cli.py" = ["S311"]
# build_silver inlines the (escaped, operator-configured) PII salt into the
# hash expression; DuckDB has no bind parameters inside COPY/INSERT SELECT.
"src/eurostream/warehouse.py" = ["S608"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["eurostream"]

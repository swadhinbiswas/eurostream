<svg width="860" height="340" viewBox="0 0 860 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">EuroStream — Lambda Architecture Flow</title>
<desc id="desc">Animated data flow: Source systems to Event Bus to Streaming and Warehouse paths to Governance</desc>
<style>
  .bg { fill: #f8fafc; }
  .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.2; }
  .card-title { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; fill: #0f172a; }
  .card-sub { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #64748b; }
  .label { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 9px; font-weight: 600; letter-spacing: 0.08em; fill: #64748b; }
  .flow { stroke-dasharray: 6 6; animation: dash 1.2s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -12; } }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.55 } }
</style>
<rect width="860" height="340" rx="16" class="bg"/>
<!-- faint grid -->
<g opacity="0.04">
  <path d="M0 20 H860 M0 60 H860 M0 100 H860 M0 180 H860 M0 220 H860 M0 260 H860" stroke="#0f172a" stroke-width="1"/>
  <path d="M120 0 V340 M240 0 V340 M360 0 V340 M520 0 V340 M680 0 V340" stroke="#0f172a" stroke-width="1"/>
</g>

<!-- SOURCE -->
<g transform="translate(18, 110)">
  <rect width="145" height="72" rx="12" class="card"/>
  <rect width="145" height="3" rx="1.5" fill="#0ea5e9" opacity="0.9"/>
  <text x="72.5" y="22" text-anchor="middle" class="card-title">SOURCE SYSTEMS</text>
  <text x="72.5" y="36" text-anchor="middle" class="card-sub">Orders · Clicks · Payments</text>
  <text x="72.5" y="52" text-anchor="middle" class="card-sub" style="font-size:9px; fill:#0ea5e9; font-weight:600">Simulated · EU data</text>
  <circle cx="72.5" cy="68" r="2.5" fill="#0ea5e9" class="pulse"/>
</g>

<!-- BUS -->
<g transform="translate(215, 110)">
  <rect width="145" height="72" rx="12" class="card" style="stroke:#0ea5e9; stroke-width:1.6"/>
  <rect width="145" height="3" rx="1.5" fill="#0ea5e9"/>
  <text x="72.5" y="22" text-anchor="middle" class="card-title">EVENT BUS</text>
  <text x="72.5" y="36" text-anchor="middle" class="card-sub">Durable log · WAL</text>
  <text x="72.5" y="52" text-anchor="middle" class="card-sub" style="font-size:8.5px; fill:#0ea5e9; font-weight:600">SQLite ⇄ Kafka</text>
</g>

<!-- STREAMING -->
<g transform="translate(415, 30)">
  <rect width="155" height="68" rx="12" class="card"/>
  <rect width="155" height="3" rx="1.5" fill="#f59e0b"/>
  <text x="77.5" y="20" text-anchor="middle" class="card-title">STREAMING PATH</text>
  <text x="77.5" y="34" text-anchor="middle" class="card-sub">FraudScorer · Windowed</text>
  <text x="77.5" y="48" text-anchor="middle" class="card-sub" style="font-size:9px; fill:#f59e0b; font-weight:600">velocity / z-score / geo</text>
</g>

<!-- WAREHOUSE -->
<g transform="translate(415, 155)">
  <rect width="155" height="88" rx="12" class="card"/>
  <rect width="155" height="3" rx="1.5" fill="#0891b2"/>
  <text x="77.5" y="20" text-anchor="middle" class="card-title">MEDALLION WAREHOUSE</text>
  <text x="77.5" y="36" text-anchor="middle" class="card-sub">Bronze → Silver → Gold</text>
  <g transform="translate(12, 48)">
    <rect width="42" height="22" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="21" y="14.5" text-anchor="middle" style="font-family: Inter, sans-serif; font-size:8px; font-weight:700; fill:#475569">BRONZE</text>
    <text x="63" y="14" text-anchor="middle" style="font-family: Inter, sans-serif; font-size:10px; fill:#94a3b8">›</text>
    <rect width="42" height="22" rx="6" fill="#ecfeff" stroke="#a5f3fc"/>
    <text x="84" y="14.5" text-anchor="middle" style="font-family: Inter, sans-serif; font-size:8px; font-weight:700; fill:#0e7490">SILVER</text>
    <text x="126" y="14" text-anchor="middle" style="font-family: Inter, sans-serif; font-size:10px; fill:#94a3b8">›</text>
    <rect width="42" height="22" rx="6" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="147" y="14.5" text-anchor="middle" style="font-family: Inter, sans-serif; font-size:8px; font-weight:700; fill:#0f766e">GOLD</text>
  </g>
</g>

<!-- GOVERNANCE -->
<g transform="translate(625, 110)">
  <rect width="155" height="72" rx="12" class="card" style="stroke:#7c3aed; stroke-width:1.2"/>
  <rect width="155" height="3" rx="1.5" fill="#7c3aed"/>
  <text x="77.5" y="22" text-anchor="middle" class="card-title">GOVERNANCE</text>
  <text x="77.5" y="36" text-anchor="middle" class="card-sub">Erasure · Audit · PII</text>
  <text x="77.5" y="52" text-anchor="middle" class="card-sub" style="font-size:8.5px; fill:#7c3aed; font-weight:600">Quality gate · SLA 60s</text>
</g>

<!-- FLOWS -->
<!-- Source -> Bus -->
<path d="M163 146 H215" stroke="#0ea5e9" stroke-width="1.6" fill="none" marker-end="url(#arrow-blue)"/>
<g>
  <circle r="3.2" fill="#0ea5e9"><animateMotion dur="1.6s" repeatCount="indefinite" path="M163 146 H215" rotate="auto"/></circle>
  <circle r="3.2" fill="#0ea5e9" opacity="0.9"><animateMotion dur="1.6s" repeatCount="indefinite" begin="0.8s" path="M163 146 H215" rotate="auto"/></circle>
</g>
<text x="189" y="138" text-anchor="middle" class="label">INGEST</text>

<!-- Bus -> Streaming (upper branch) -->
<path d="M360 128 C 390 128, 390 64, 415 64" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-dasharray="6 5" class="flow" marker-end="url(#arrow-amber)"/>
<circle r="3" fill="#f59e0b"><animateMotion dur="1.8s" repeatCount="indefinite" path="M360 128 C 390 128, 390 64, 415 64" rotate="auto"/></circle>

<!-- Bus -> Warehouse (middle) -->
<path d="M360 146 H415" stroke="#0891b2" stroke-width="1.6" fill="none" marker-end="url(#arrow-cyan)"/>
<circle r="3.2" fill="#0891b2"><animateMotion dur="1.7s" repeatCount="indefinite" path="M360 146 H415" rotate="auto"/></circle>
<circle r="3.2" fill="#0891b2" opacity="0.85"><animateMotion dur="1.7s" repeatCount="indefinite" begin="0.85s" path="M360 146 H415" rotate="auto"/></circle>
<text x="387" y="158" text-anchor="middle" class="label">BATCH</text>

<!-- Streaming -> Governance -->
<path d="M570 64 C 600 64, 600 126, 625 128" stroke="#f59e0b" stroke-width="1.2" fill="none" stroke-dasharray="5 5" opacity="0.9"/>
<text x="598" y="86" text-anchor="middle" class="label" style="fill:#f59e0b">ALERTS</text>

<!-- Warehouse -> Governance -->
<path d="M570 199 H625" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#arrow-violet)"/>
<circle r="3" fill="#7c3aed"><animateMotion dur="1.9s" repeatCount="indefinite" path="M570 199 H625" rotate="auto"/></circle>
<text x="597" y="192" text-anchor="middle" class="label" style="fill:#7c3aed">CASCADE</text>

<!-- Governance feedback to Bus (dotted) -->
<path d="M702 182 C 702 260, 287 260, 287 182" stroke="#7c3aed" stroke-width="1" fill="none" stroke-dasharray="4 6" opacity="0.45"/>
<text x="430" y="272" text-anchor="middle" class="label" style="fill:#7c3aed; font-size:8px">TOMBSTONE · SUPPRESSION</text>

<defs>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0ea5e9"/></marker>
  <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker>
  <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/></marker>
  <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
</defs>

<!-- footer caption -->
<text x="430" y="310" text-anchor="middle" style="font-family: Inter, sans-serif; font-size:9px; fill:#94a3b8; letter-spacing:0.04em">Lambda architecture · durable log shared by speed and batch paths · governance enforced at every layer</text>
<text x="430" y="324" text-anchor="middle" style="font-family: Inter, sans-serif; font-size:8px; fill:#cbd5e1">SQLite ⇄ Kafka · DuckDB → Turso/Snowflake · Pure Python · EU data residency eu-central-1</text>
</svg>

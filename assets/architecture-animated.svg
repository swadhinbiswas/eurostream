<svg width="920" height="420" viewBox="0 0 920 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">EuroStream — Enterprise GDPR-Native Streaming &amp; Medallion Architecture</title>
<desc id="desc">Comprehensive data flow: EU Event Ingestion to Event Bus to Streaming Fraud Engine, Multi-Engine Medallion Warehouse, 6-Layer Erasure Cascade, and Governance Observability</desc>
<defs>
  <linearGradient id="grad-sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#0369a1"/></linearGradient>
  <linearGradient id="grad-indigo" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#4338ca"/></linearGradient>
  <linearGradient id="grad-emerald" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#047857"/></linearGradient>
  <linearGradient id="grad-amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#b45309"/></linearGradient>
  <linearGradient id="grad-rose" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f43f5e"/><stop offset="100%" stop-color="#be123c"/></linearGradient>
  <linearGradient id="grad-cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0e7490"/></linearGradient>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/></filter>
  <style>
    .bg { fill: #090d16; }
    .card { fill: #111827; stroke: #1f2937; stroke-width: 1.2; rx: 12px; }
    .card-hi { fill: #111827; stroke: #38bdf8; stroke-width: 1.6; rx: 12px; }
    .card-title { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; fill: #f8fafc; }
    .card-sub { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #94a3b8; }
    .badge { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 8.5px; font-weight: 600; }
    .flow-line { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-dasharray: 6 6; animation: dash 1.4s linear infinite; }
    .flow-sky { stroke: #38bdf8; }
    .flow-amber { stroke: #fbbf24; }
    .flow-emerald { stroke: #34d399; }
    .flow-rose { stroke: #fb7185; }
    .flow-indigo { stroke: #818cf8; }
    @keyframes dash { to { stroke-dashoffset: -12; } }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.4 } }
  </style>
</defs>

<rect width="920" height="420" rx="16" class="bg"/>

<!-- Grid lines -->
<g opacity="0.06">
  <path d="M0 40 H920 M0 100 H920 M0 160 H920 M0 220 H920 M0 280 H920 M0 340 H920 M0 400 H920" stroke="#94a3b8" stroke-width="1"/>
  <path d="M60 0 V420 M180 0 V420 M320 0 V420 M480 0 V420 M640 0 V420 M800 0 V420" stroke="#94a3b8" stroke-width="1"/>
</g>


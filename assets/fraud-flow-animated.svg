<svg width="860" height="360" viewBox="0 0 860 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">EuroStream — Real-time Fraud Detection Flow</title>
<desc id="desc">Payment stream enters tumbling window, evaluated by velocity, amount z-score and geo-mismatch rules, gated by suppression before alert</desc>
<style>
  .bg { fill: #f8fafc; }
  .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.2; }
  .card-title { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; fill: #0f172a; }
  .card-sub { font-family: Inter, sans-serif; font-size: 9.5px; fill: #64748b; }
  .rule { fill: #ffffff; stroke-width: 1.4; }
  .rule-v { stroke: #f59e0b; }
  .rule-z { stroke: #0891b2; }
  .rule-g { stroke: #7c3aed; }
  .pulse { animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.45 } }
  .flow-dash { stroke-dasharray: 6 5; animation: dash 1.1s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -11; } }
</style>
<rect width="860" height="360" rx="16" class="bg"/>

<!-- PAYMENT STREAM -->
<g transform="translate(18, 120)">
  <rect width="138" height="72" rx="12" class="card" style="stroke:#0ea5e9; stroke-width:1.5"/>
  <rect width="138" height="3" rx="1.5" fill="#0ea5e9"/>
  <text x="69" y="22" text-anchor="middle" class="card-title">PAYMENT STREAM</text>
  <text x="69" y="36" text-anchor="middle" class="card-sub">country · amount</text>
  <text x="69" y="50" text-anchor="middle" style="font-family: monospace; font-size:8px; fill:#0ea5e9; font-weight:600">PaymentProcessed</text>
</g>

<!-- WINDOW -->
<g transform="translate(200, 120)">
  <rect width="150" height="72" rx="12" class="card"/>
  <rect width="150" height="3" rx="1.5" fill="#334155"/>
  <text x="75" y="22" text-anchor="middle" class="card-title">TUMBLING WINDOW</text>
  <text x="75" y="36" text-anchor="middle" class="card-sub">300s · per customer</text>
  <g transform="translate(18, 46)">
    <rect width="114" height="16" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
    <rect x="6" y="4" width="28" height="8" rx="4" fill="#0ea5e9" opacity="0.9"/>
    <rect x="38" y="4" width="18" height="8" rx="4" fill="#0ea5e9" opacity="0.7"/>
    <rect x="60" y="4" width="22" height="8" rx="4" fill="#0ea5e9" opacity="0.5"/>
    <rect x="86" y="4" width="14" height="8" rx="4" fill="#cbd5e1"/>
  </g>
  <text x="75" y="68" text-anchor="middle" style="font-family: Inter, sans-serif; font-size:7.5px; fill:#94a3b8; letter-spacing:0.06em">DEQUE(200) · EXPIRE@50</text>
</g>

<!-- RULES STACK -->
<g transform="translate(395, 28)">
  <!-- Velocity -->
  <g class="pulse">
    <rect width="165" height="56" rx="10" class="card rule rule-v"/>
    <rect width="4" height="56" rx="2" fill="#f59e0b"/>
    <text x="18" y="20" class="card-title" style="font-size:10px; fill:#92400e">VELOCITY</text>
    <text x="18" y="32" class="card-sub" style="font-size:8.5px">count == threshold+1</text>
    <text x="18" y="44" style="font-family: monospace; font-size:7.5px; fill:#b45309">once per window</text>
    <text x="148" y="20" text-anchor="middle" style="font-family: Inter, sans-serif; font-size:11px; font-weight:800; fill:#f59e0b">6</text>
  </g>
  <!-- Amount -->
  <g transform="translate(0, 72)">
    <rect width="165" height="56" rx="10" class="card rule rule-z"/>
    <rect width="4" height="56" rx="2" fill="#0891b2"/>
    <text x="18" y="20" class="card-title" style="font-size:10px; fill:#0e7490">AMOUNT Z-SCORE</text>
    <text x="18" y="32" class="card-sub" style="font-size:8.5px">|x - mean| / std &gt; k</text>
    <text x="18" y="44" style="font-family: monospace; font-size:7.5px; fill:#0e7490">sample N-1 · history BEFORE</text>
  </g>
  <!-- Geo -->
  <g transform="translate(0, 144)">
    <rect width="165" height="56" rx="10" class="card rule rule-g"/>
    <rect width="4" height="56" rx="2" fill="#7c3aed"/>
    <text x="18" y="20" class="card-title" style="font-size:10px; fill:#5b21b6">GEO MISMATCH</text>
    <text x="18" y="32" class="card-sub" style="font-size:8.5px">country ≠ merchant</text>
    <text x="18" y="44" style="font-family: monospace; font-size:7.5px; fill:#6d28d9">once per window</text>
  </g>
  <!-- bracket -->
  <path d="M-10 22 V182" stroke="#94a3b8" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.6"/>
  <circle cx="-10" cy="14" r="3" fill="#94a3b8" opacity="0.6"/>
  <circle cx="-10" cy="190" r="3" fill="#94a3b8" opacity="0.6"/>
</g>

<!-- SUPPRESSION GATE -->
<g transform="translate(595, 92)">
  <rect width="120" height="64" rx="12" class="card" style="stroke:#e11d48; stroke-width:1.3; fill:#fff1f2"/>
  <text x="60" y="20" text-anchor="middle" class="card-title" style="fill:#881337">SUPPRESSION</text>
  <text x="60" y="34" text-anchor="middle" class="card-sub" style="font-size:8.5px; fill:#9f1239">erasure registry</text>
  <text x="60" y="48" text-anchor="middle" style="font-family: monospace; font-size:7px; fill:#e11d48; font-weight:700">commit-before-continue</text>
</g>

<!-- ALERT OUT -->
<g transform="translate(745, 108)">
  <rect width="95" height="72" rx="12" class="card" style="stroke:#16a34a; stroke-width:1.5"/>
  <rect width="95" height="3" rx="1.5" fill="#16a34a"/>
  <text x="47.5" y="22" text-anchor="middle" class="card-title" style="fill:#14532d">FRAUD ALERT</text>
  <text x="47.5" y="36" text-anchor="middle" class="card-sub">rule · severity</text>
  <text x="47.5" y="52" text-anchor="middle" style="font-family: monospace; font-size:7.5px; fill:#16a34a; font-weight:700">→ fraud_alerts</text>
  <circle cx="47.5" cy="66" r="2.2" fill="#16a34a" class="pulse"/>
</g>

<!-- FLOWS -->
<!-- Payment -> Window -->
<path d="M156 156 H200" stroke="#0ea5e9" stroke-width="1.6" fill="none" marker-end="url(#a-blue)"/>
<g><circle r="3.2" fill="#0ea5e9"><animateMotion dur="1.5s" repeatCount="indefinite" path="M156 156 H200"/></circle><circle r="3.2" fill="#0ea5e9" opacity="0.85"><animateMotion dur="1.5s" repeatCount="indefinite" begin="0.75s" path="M156 156 H200"/></circle></g>

<!-- Window -> Rules (fan out) -->
<path d="M350 146 C 372 146, 372 56, 395 56" stroke="#f59e0b" stroke-width="1.2" fill="none" class="flow-dash" marker-end="url(#a-amber)" opacity="0.9"/>
<path d="M350 156 H395" stroke="#0891b2" stroke-width="1.3" fill="none" marker-end="url(#a-cyan)"/>
<path d="M350 166 C 372 166, 372 162, 395 162" stroke="#7c3aed" stroke-width="1.2" fill="none" class="flow-dash" marker-end="url(#a-violet)" opacity="0.9"/>
<circle r="2.8" fill="#0ea5e9"><animateMotion dur="1.8s" repeatCount="indefinite" path="M350 146 C 372 146, 372 56, 395 56"/></circle>

<!-- Rules -> Suppression -->
<path d="M560 84 H595" stroke="#64748b" stroke-width="1.2" fill="none" stroke-dasharray="4 4" opacity="0.7"/>
<path d="M560 124 H595" stroke="#64748b" stroke-width="1.2" fill="none" stroke-dasharray="4 4" opacity="0.7"/>
<path d="M560 164 H595" stroke="#64748b" stroke-width="1.2" fill="none" stroke-dasharray="4 4" opacity="0.7"/>
<text x="577" y="100" text-anchor="middle" style="font-family: Inter, sans-serif; font-size:7px; fill:#64748b; font-weight:700">SCORE</text>

<!-- Suppression -> Alert -->
<path d="M715 124 H745" stroke="#16a34a" stroke-width="1.6" fill="none" marker-end="url(#a-green)"/>
<circle r="3" fill="#16a34a"><animateMotion dur="1.4s" repeatCount="indefinite" path="M715 124 H745"/></circle>
<text x="730" y="118" text-anchor="middle" style="font-family: Inter, sans-serif; font-size:7px; fill:#16a34a; font-weight:700">ALLOW</text>

<!-- Suppression block arrow -->
<path d="M655 156 V210 H415 V216" stroke="#e11d48" stroke-width="1" fill="none" stroke-dasharray="4 6" opacity="0.5"/>
<text x="520" y="222" text-anchor="middle" style="font-family: Inter, sans-serif; font-size:8px; fill:#e11d48; letter-spacing:0.06em; font-weight:600">SUPPRESSED → COMMIT + SKIP (poison-pill safe)</text>

<!-- checkpoint badge -->
<g transform="translate(200, 204)">
  <rect width="150" height="18" rx="9" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="75" y="12" text-anchor="middle" style="font-family: monospace; font-size:7.5px; fill:#475569; font-weight:600">checkpoint() / restore() · Flink-style</text>
</g>

<defs>
  <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0ea5e9"/></marker>
  <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker>
  <marker id="a-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/></marker>
  <marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
  <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
</defs>
<text x="430" y="336" text-anchor="middle" style="font-family: Inter, sans-serif; font-size:8.5px; fill:#94a3b8; letter-spacing:0.04em">Sample variance (N-1) · history excludes current payment · tumbling window 300s · per-customer deque(200) · commit-before-continue</text>
</svg>
